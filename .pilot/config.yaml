supervisor:
  # Default model for the Pilot supervisor.
  model: deepseek/deepseek-chat
  # Models offered in the engine picker's Pilot submenu. Omit to fall back to
  # the built-in list (deepseek-chat, deepseek-reasoner).
  models:
    - deepseek/deepseek-chat
    - deepseek/deepseek-reasoner

agents:
  opencode:
    command: opencode
    args: ["acp"]
    capabilities: ["code-edit", "bash", "git", "reasoning"]
    strengths: ["complex-refactor", "multi-file-changes", "general-coding"]

  codex:
    command: npx
    args: ["-y", "@agentclientprotocol/codex-acp"]
    capabilities: ["code-edit", "bash"]
    strengths: ["test-generation", "quick-fixes"]
